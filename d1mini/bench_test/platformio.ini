; TARS - bench test on a Wemos D1 mini (ESP8266): 1.3" ST7789 screen, INMP441 mic,
; MAX98357A amp + speaker. Wiring and serial commands: src/main.cpp.
;
;   uvx platformio run -t upload
;   uvx platformio device monitor   (115200 baud)
; Assets (photo, MP3): uv run ../../bench_assets/make_assets.py

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_echo = yes
monitor_filters = time, esp8266_exception_decoder
build_flags = -I ../../bench_assets
lib_deps = earlephilhower/ESP8266Audio@1.9.9
