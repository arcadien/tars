; TARS - 1.3" ST7789 240x240 screen test (lcd130cs) on a Pro Micro.
;
; Pick the env matching the Pro Micro variant (5 V board: dividers on the signals, see src/main.cpp):
;   5 V / 16 MHz  -> pio run -e promicro16 -t upload
;   3.3 V / 8 MHz -> pio run -e promicro8  -t upload
; Serial monitor: pio device monitor -e promicro16  (115200 baud)
; Photo: uv run make_image.py (rewrites src/image.h)

[platformio]
default_envs = promicro16

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = time

[env:promicro16]
board = sparkfun_promicro16

[env:promicro8]
board = sparkfun_promicro8
