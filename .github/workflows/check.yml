# Model, STL, ERC and docs checks with the pinned OpenSCAD (TECH-BUILD-CHECKS-001); main's branch protection requires
# the `check` job. Renders are left to the pre-push hook (they need a display).
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OPENSCAD_VERSION: "2026.10.27"   # pinned (TECH-BUILD-ARTIFACTS-001): same as CONTRIBUTING.md
  OPENSCAD_SHA256: 13be4bac3aa25fcb2b7065cef5a02a5bb258fdac65f4eb49399e529d3d9468e3

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # nightly snapshots are pruned from files.openscad.org after a while: the cache keeps the pinned one
      - uses: actions/cache@v4
        with:
          path: ~/openscad
          key: openscad-${{ env.OPENSCAD_VERSION }}

      - name: OpenSCAD ${{ env.OPENSCAD_VERSION }}
        run: |
          mkdir -p ~/openscad ~/bin
          f=~/openscad/OpenSCAD-$OPENSCAD_VERSION-x86_64.AppImage
          [ -f "$f" ] || curl -fsSL -o "$f" "https://files.openscad.org/snapshots/$(basename "$f")"
          echo "$OPENSCAD_SHA256  $f" | sha256sum -c -
          chmod +x "$f"
          (cd ~/openscad && rm -rf squashfs-root && "$f" --appimage-extract > /dev/null)
          printf '#!/bin/sh\nexec %s/openscad/squashfs-root/AppRun "$@"\n' "$HOME" > ~/bin/openscad
          chmod +x ~/bin/openscad
          echo ~/bin >> "$GITHUB_PATH"

      - name: KiCad 10, Ghostscript
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends kicad ghostscript

      - uses: astral-sh/setup-uv@v6   # uvx pytest: requirement acceptance tests (erc stage)

      - name: Checks
        run: |
          openscad --version
          scripts/check.sh model stl erc docs

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: build/check/
