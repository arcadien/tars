; TARS - bench test on the LOLIN S3 Mini with the TARS pin map: both ST7789 screens,
; INMP441 mic, MAX98357A amp + speaker. Wiring and serial commands: src/main.cpp.
;
;   uvx platformio run -t upload      (if the port doesn't show: hold 0 / BOOT, press RST)
;   uvx platformio device monitor     (USB-C, 115200 baud)
; Assets (photo, MP3): uv run ../../bench_assets/make_assets.py

[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../../bench_assets
monitor_speed = 115200
monitor_echo = yes
monitor_filters = time, esp32_exception_decoder
lib_deps = earlephilhower/ESP8266Audio@2.4.1
